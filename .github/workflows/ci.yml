name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, audit and production build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require a committed lockfile
        run: |
          test -f bun.lock || (
            echo "bun.lock is missing. Run bun install locally and commit the lockfile."
            exit 1
          )

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Dependency security audit
        run: bun audit --audit-level=high

      - name: Production build
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
