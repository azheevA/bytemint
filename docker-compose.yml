services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_ADSENSE_SLOT_TOP: ${NEXT_PUBLIC_ADSENSE_SLOT_TOP:-}
        NEXT_PUBLIC_AFFILIATE_HOSTING_URL: ${NEXT_PUBLIC_AFFILIATE_HOSTING_URL:-}
        NEXT_PUBLIC_AFFILIATE_AI_URL: ${NEXT_PUBLIC_AFFILIATE_AI_URL:-}
        NEXT_PUBLIC_PREMIUM_PRODUCT_URL: ${NEXT_PUBLIC_PREMIUM_PRODUCT_URL:-}
    container_name: bytemint-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
